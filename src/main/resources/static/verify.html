<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobRunr MCP · Signing you in</title>
  <meta name="referrer" content="no-referrer">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Ubuntu+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2306121e' stroke='%238b5cf6' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%232ee6a6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/hub.css">
</head>
<body>
<div class="glow"></div>
<div class="wrap" style="max-width:560px">
  <header class="top">
    <a class="brand" href="/signup"><img src="/jobrunr-logo.png" alt="JobRunr"><span class="pill">MCP</span></a>
  </header>
  <section class="card">
    <h2 id="title">Signing you in…</h2>
    <p id="message" class="muted">One moment.</p>
    <a class="btn hidden" id="retry" href="/signup#signin">Request a new link</a>
  </section>
</div>
<script>
(async () => {
  // the secret travels in the fragment, so it never reaches server logs and link scanners cannot use it up
  const token = location.hash.slice(1);
  history.replaceState(null, "", "/verify");
  const fail = (message) => {
    document.getElementById("title").textContent = "This link did not work";
    document.getElementById("message").textContent = message;
    document.getElementById("retry").classList.remove("hidden");
  };
  if (!token) { fail("The link is incomplete. Request a new one."); return; }
  try {
    const response = await fetch("/api/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) });
    const json = await response.json().catch(() => ({}));
    if (!response.ok) { fail(json.error || "Please request a new link."); return; }
    location.replace("/account");
  } catch (e) {
    fail("We could not reach the server. Please try again.");
  }
})();
</script>
</body>
</html>
