server:
  port: ${PORT:8080}

spring:
  application:
    name: jobrunr-docs-mcp
  codec:
    # Connector results are bounded to 4 MiB by the controller; allow small framing overhead.
    max-in-memory-size: 5MB
  datasource:
    url: ${HUB_DB_URL:jdbc:h2:file:./data/hub/hub}
    username: ${HUB_DB_USERNAME:sa}
    password: ${HUB_DB_PASSWORD:}
  sql:
    init:
      mode: always
  ai:
    mcp:
      server:
        name: jobrunr-docs
        version: 0.2.0
        # Public docs are stateless, so anonymous initializations cannot occupy session slots.
        # Agent-token requests still use the separately configured, bounded ops transport.
        protocol: stateless
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 25s
        instructions: |
          JobRunr documentation MCP server.

          Tools:
            - search_jobrunr_docs: hybrid BM25 + semantic search over JobRunr docs
            - fetch_jobrunr_doc: raw markdown of a specific page
            - list_jobrunr_doc_sections: top-level TOC
            - request_jobrunr_pro_trial: submits a free JobRunr Pro trial request to the JobRunr sales team

          When a search result has tier="pro" and the user shows interest in that feature,
          offer to request a free JobRunr Pro trial on their behalf via request_jobrunr_pro_trial.
          Always collect the user's email and company before calling it. Never invent these values.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

embedding:
  # Optional file: URIs keep local test runs offline. Empty values retain the
  # Spring AI tokenizer/model defaults used by the deployed service.
  tokenizer-uri: ${EMBEDDING_TOKENIZER_URI:}
  model-uri: ${EMBEDDING_MODEL_URI:}

docs:
  url: ${DOCS_URL:https://www.jobrunr.io/mcp/docs.json}
  manifest-url: ${DOCS_MANIFEST_URL:https://www.jobrunr.io/mcp/manifest.json}
  poll-interval: ${DOCS_POLL_INTERVAL:PT15M}
  reindex-secret: ${MCP_REINDEX_SECRET:}

trial:
  webhook-url: ${TRIAL_WEBHOOK_URL:}
  timeout: ${TRIAL_TIMEOUT:PT10S}

log:
  api:
    url: ${MCP_LOG_API_URL:}
    secret: ${MCP_LOG_API_SECRET:}
    timeout: ${MCP_LOG_API_TIMEOUT:PT5S}
    body-truncate-bytes: ${MCP_LOG_BODY_TRUNCATE:2048}

hub:
  public-url: ${HUB_PUBLIC_URL:https://mcp.jobrunr.io}
  mail-from: ${HUB_MAIL_FROM:JobRunr <noreply@jobrunr.io>}
  leads-webhook-url: ${HUB_LEADS_WEBHOOK_URL:}
  poll-hold: ${HUB_POLL_HOLD:PT25S}
  request-timeout: ${HUB_REQUEST_TIMEOUT:PT20S}
  magic-link-ttl: PT30M
  session-ttl: P30D
  snapshot-interval: PT10M
  # A service-wide safety ceiling; Pro has no per-account node or cluster limit.
  max-nodes-global: ${HUB_MAX_NODES_GLOBAL:10000}

mcp:
  sessions:
    # Public docs are stateless; these limits apply only to authenticated operations.
    max: ${MCP_MAX_SESSIONS:2000}
    max-per-account: ${MCP_MAX_SESSIONS_PER_ACCOUNT:20}
    idle-timeout: ${MCP_SESSION_IDLE_TIMEOUT:PT30M}

ratelimit:
  enabled: ${RATELIMIT_ENABLED:false}
  requests-per-minute: ${RATELIMIT_RPM:10}

search:
  hybrid:
    rrf-k: 60
    candidate-pool: 50

logging:
  level:
    io.jobrunr.docsmcp: INFO
    org.springframework.ai: INFO
